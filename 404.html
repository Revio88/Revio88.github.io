<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata — Federico Reviati</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #F8F8F8;
      --bg-2:        #EFEFEF;
      --border:      #DCDCDC;
      --ink:         #111111;
      --ink-2:       #444444;
      --ink-3:       #555555;
      --ink-4:       #BBBBBB;
    }
    [data-theme="dark"] {
      --bg:          #111111;
      --bg-2:        #1A1A1A;
      --border:      #2C2C2C;
      --ink:         #F0F0F0;
      --ink-2:       #CCCCCC;
      --ink-3:       #BBBBBB;
      --ink-4:       #BBBBBB;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg:          #111111;
        --bg-2:        #1A1A1A;
        --border:      #2C2C2C;
        --ink:         #F0F0F0;
        --ink-2:       #CCCCCC;
        --ink-3:       #BBBBBB;
        --ink-4:       #BBBBBB;
      }
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 300;
      line-height: 1.65;
      min-height: 100vh;
      transition: background 0.25s, color 0.25s;
    }

    .page {
      max-width: 620px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 1rem;
    }

    .code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--ink-4);
      line-height: 1;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 0.9rem;
    }

    p {
      font-size: 0.9rem;
      color: var(--ink-2);
      margin-bottom: 2rem;
      max-width: 440px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 0.7rem 1.2rem;
      width: fit-content;
      transition: background 0.15s, border-color 0.15s;
    }
    .back-link:hover { background: var(--bg-2); border-color: var(--ink-3); }
  </style>
</head>
<body>
  <div class="page">
    <p class="label">Errore 404</p>
    <p class="code">404</p>
    <h1>Pagina non trovata</h1>
    <p>La pagina che stai cercando non esiste o è stata spostata. Torna alla home per continuare la navigazione.</p>
    <a href="/" class="back-link">← Torna alla home</a>
  </div>
</body>
</html>
